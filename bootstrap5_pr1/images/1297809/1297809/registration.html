<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<body>
    <form action="">
        <label>Id:</label><br>
        <input type="text" name="id" placeholder="Enter your Id"><br>
        <label>Name:</label><br>
        <textarea name="name" placeholder="Enter your name"></textarea><br>
        <label>Round:</label><br>
        <select name="round">
            <option value="">Select Round</option>
            <option value="1">Round 60</option>
            <option value="2">Round 61</option>
            <option value="3">Round 62</option>
            <option value="4">Round 63</option>
            <option value="5">Round 64</option>
            <option value="6">Round 65</option>
            <option value="7">Round 66</option>
            <option value="8">Round 67</option>
            <option value="9">Round 68</option>
            <option value="10">Round 69</option>
            <option value="11">Round 70</option>
            <option value="12">Round 71</option>
            <option value="13">Round 72</option>
            <option value="14">Round 73</option>
        </select><br>
        <label>Gender:</label><br>
        <input type="radio" name="gender" value="m">Male
        <input type="radio" name="gender" value="f">Female
        <input type="radio" name="gender" value="o">Others <br>
        <label>Education:</label><br>
        <input type="checkbox" name="education">SSC
        <input type="checkbox" name="education">HSC <br>
        <input type="reset" name="reset" value="Reset">
        <input type="submit" name="submit" value="Submit">
    </form>
</body>
</html>
